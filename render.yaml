services:
  - type: web
    name: polyglot-edge-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: POLYGLOT_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POLYGLOT_ALLOWED_ORIGINS
        sync: false
      - key: POLYGLOT_READINESS_CACHE_SECONDS
        value: "300"
      - key: POLYGLOT_MAX_REQUEST_BYTES
        value: "128000"
      - key: POLYGLOT_MAX_PROMPT_CHARS
        value: "12000"
      - key: POLYGLOT_CONTEXT_TOKEN_LIMIT
        value: "4096"
      - key: POLYGLOT_INFERENCE_TIMEOUT_SECONDS
        value: "120"
      - key: POLYGLOT_RATE_LIMIT_REQUESTS
        value: "30"
      - key: POLYGLOT_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
