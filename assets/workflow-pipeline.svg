<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <!-- Background styling -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <style>
      @keyframes flowRight {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3)); }
        50% { filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.6)); }
      }
      @keyframes packetDot {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(110px); opacity: 0; }
      }
      .anim-wire { stroke-dasharray: 6 6; animation: flowRight 1.5s linear infinite; }
      .glow-box { animation: pulseNode 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="280" rx="14" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Step 1: Browser Extension -->
  <g transform="translate(35, 45)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#0284c7" fill-opacity="0.2"/>
    <path d="M 80 45 C 80 38 85 33 90 33 C 95 33 100 38 100 45 C 100 52 95 57 90 57" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="90" cy="45" r="4" fill="#38bdf8"/>
    <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Client Hook</text>
    <text x="90" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Chrome Extension MV3</text>
    <text x="90" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Intercepts prompt keystrokes</text>
    <rect x="25" y="162" width="130" height="20" rx="6" fill="#0369a1" fill-opacity="0.3"/>
    <text x="90" y="176" fill="#7dd3fc" font-family="monospace" font-size="9.5" text-anchor="middle">localhost:8000</text>
  </g>

  <!-- Connection Wire 1 -> 2 -->
  <path d="M 215 140 L 255 140" stroke="#38bdf8" stroke-width="2.5" fill="none" class="anim-wire"/>
  <polygon points="255,140 247,135 247,145" fill="#38bdf8"/>

  <!-- Step 2: Edge PolyglotCore Guardrails -->
  <g transform="translate(255, 45)" class="glow-box">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#4338ca" fill-opacity="0.2"/>
    <path d="M 78 40 L 90 34 L 102 40 L 102 48 C 102 54 90 60 90 60 C 90 60 78 54 78 48 Z" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. Edge Guardrails</text>
    <text x="90" y="122" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Strands Decider 2B SLM</text>
    <text x="90" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Jailbreak &amp; Safety check</text>
    <rect x="25" y="162" width="130" height="20" rx="6" fill="#4338ca" fill-opacity="0.3"/>
    <text x="90" y="176" fill="#c7d2fe" font-family="monospace" font-size="9.5" text-anchor="middle">Latency &lt; 15ms (GPU)</text>
  </g>

  <!-- Connection Wire 2 -> 3 -->
  <path d="M 435 140 L 475 140" stroke="#818cf8" stroke-width="2.5" fill="none" class="anim-wire"/>
  <polygon points="475,140 467,135 467,145" fill="#818cf8"/>

  <!-- Step 3: Context Budget & Pruning -->
  <g transform="translate(475, 45)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad1)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#065f46" fill-opacity="0.2"/>
    <path d="M 78 36 H 102 V 54 H 78 Z M 83 42 H 97 M 83 48 H 93" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Context Manager</text>
    <text x="90" y="122" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dynamic Token Budget</text>
    <text x="90" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Priority &amp; Role retention</text>
    <rect x="25" y="162" width="130" height="20" rx="6" fill="#065f46" fill-opacity="0.3"/>
    <text x="90" y="176" fill="#a7f3d0" font-family="monospace" font-size="9.5" text-anchor="middle">Budget &lt; 4096 tokens</text>
  </g>

  <!-- Connection Wire 3 -> 4 -->
  <path d="M 655 140 L 695 140" stroke="#34d399" stroke-width="2.5" fill="none" class="anim-wire"/>
  <polygon points="695,140 687,135 687,145" fill="#34d399"/>

  <!-- Step 4: Model Routing -->
  <g transform="translate(695, 45)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="90" cy="45" r="24" fill="#78350f" fill-opacity="0.2"/>
    <path d="M 78 52 L 78 44 C 78 38 82 35 88 35 L 102 35 M 96 29 L 102 35 L 96 41 M 78 44 L 102 52" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Dynamic Router</text>
    <text x="90" y="122" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Complexity Classifier</text>
    <text x="90" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">P(complex) &gt;= 0.60</text>
    <rect x="25" y="162" width="130" height="20" rx="6" fill="#78350f" fill-opacity="0.3"/>
    <text x="90" y="176" fill="#fde68a" font-family="monospace" font-size="9.5" text-anchor="middle">Saves ~65% API Cost</text>
  </g>

  <!-- Connection Wire 4 -> 5 -->
  <path d="M 875 140 L 915 140" stroke="#f59e0b" stroke-width="2.5" fill="none" class="anim-wire"/>
  <polygon points="915,140 907,135 907,145" fill="#f59e0b"/>

  <!-- Step 5: Cloud LLM & Supabase -->
  <g transform="translate(915, 45)">
    <rect width="150" height="190" rx="12" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="75" cy="45" r="24" fill="#831843" fill-opacity="0.2"/>
    <path d="M 65 52 C 60 52 56 48 56 43 C 56 39 59 36 63 35 C 65 29 71 25 78 27 C 83 25 89 28 91 33 C 94 34 96 37 96 41 C 96 47 91 52 85 52 Z" fill="none" stroke="#f472b6" stroke-width="2.2"/>
    <text x="75" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">5. Cloud &amp; DB</text>
    <text x="75" y="122" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Gemini 2.5 Flash</text>
    <text x="75" y="142" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Supabase Postgres</text>
    <rect x="15" y="162" width="120" height="20" rx="6" fill="#831843" fill-opacity="0.3"/>
    <text x="75" y="176" fill="#fbcfe8" font-family="monospace" font-size="9.5" text-anchor="middle">SHA-256 Auth &amp; Logs</text>
  </g>
</svg>

