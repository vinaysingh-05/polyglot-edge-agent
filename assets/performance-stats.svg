<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" width="100%" height="100%">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <style>
      @keyframes countPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .metric-num { animation: countPulse 4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <rect width="1100" height="200" rx="12" fill="url(#statBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Card 1: Edge Latency -->
  <g transform="translate(35, 25)">
    <rect width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">EDGE GUARDRAIL SPEED</text>
    <text x="20" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="36" font-weight="900" class="metric-num">&lt; 15 ms</text>
    <rect x="20" y="100" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="100" width="180" height="6" rx="3" fill="url(#barCyan)"/>
    <text x="20" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Strands 2B LoRA on Qwen3.5</text>
  </g>

  <!-- Card 2: Cost Savings -->
  <g transform="translate(295, 25)">
    <rect width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API COST REDUCTION</text>
    <text x="20" y="78" fill="#34d399" font-family="system-ui, sans-serif" font-size="36" font-weight="900" class="metric-num">~68%</text>
    <rect x="20" y="100" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="100" width="130" height="6" rx="3" fill="url(#barGreen)"/>
    <text x="20" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Early block &amp; context pruning</text>
  </g>

  <!-- Card 3: Model Routing Efficiency -->
  <g transform="translate(555, 25)">
    <rect width="230" height="150" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FRONTIER MODEL SAVINGS</text>
    <text x="20" y="78" fill="#c084fc" font-family="system-ui, sans-serif" font-size="36" font-weight="900" class="metric-num">0.60 τ</text>
    <rect x="20" y="100" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="100" width="114" height="6" rx="3" fill="url(#barPurple)"/>
    <text x="20" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Confidence-calibrated routing</text>
  </g>

  <!-- Card 4: Leakage Prevention -->
  <g transform="translate(815, 25)">
    <rect width="250" height="150" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ZERO CLOUD LEAKAGE</text>
    <text x="20" y="78" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="36" font-weight="900" class="metric-num">100%</text>
    <rect x="20" y="100" width="210" height="6" rx="3" fill="#1e293b"/>
    <rect x="20" y="100" width="210" height="6" rx="3" fill="#fbbf24"/>
    <text x="20" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Jailbreaks killed at client edge</text>
  </g>
</svg>

