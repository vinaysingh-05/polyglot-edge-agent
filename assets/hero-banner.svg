<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleOrb" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes wireFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.4; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.3; filter: drop-shadow(0 0 1px #10b981); }
      }

      .pulse-glow { animation: pulseLight 4s ease-in-out infinite; transform-origin: center; }
      .float-item { animation: floatSlow 5s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8 12; animation: wireFlow 2.5s linear infinite; }
      .status-dot { animation: blinkDot 1.8s ease-in-out infinite; }
      .scan-beam { animation: scanline 6s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGlow)" rx="16"/>
  <rect width="1200" height="400" fill="url(#cyanOrb)" rx="16"/>
  <rect width="1200" height="400" fill="url(#purpleOrb)" rx="16"/>
  <rect width="1200" height="400" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Line Effect -->
  <rect class="scan-beam" x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Network Circuit Lines (Background) -->
  <g opacity="0.35">
    <path d="M 80 120 L 220 120 L 260 160 L 380 160" fill="none" stroke="#0ea5e9" stroke-width="1.5" class="data-stream"/>
    <path d="M 1120 120 L 980 120 L 940 160 L 820 160" fill="none" stroke="#a855f7" stroke-width="1.5" class="data-stream"/>
    <path d="M 160 280 L 280 280 L 320 240 L 420 240" fill="none" stroke="#38bdf8" stroke-width="1.5" class="data-stream"/>
    <path d="M 1040 280 L 920 280 L 880 240 L 780 240" fill="none" stroke="#c084fc" stroke-width="1.5" class="data-stream"/>
    <circle cx="380" cy="160" r="3.5" fill="#38bdf8"/>
    <circle cx="820" cy="160" r="3.5" fill="#c084fc"/>
    <circle cx="420" cy="240" r="3.5" fill="#38bdf8"/>
    <circle cx="780" cy="240" r="3.5" fill="#c084fc"/>
  </g>

  <!-- Status Live Badge -->
  <g transform="translate(470, 48)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="1" y="1" width="258" height="30" rx="15" fill="url(#pillGrad)"/>
    <circle class="status-dot" cx="20" cy="16" r="4.5" fill="#10b981"/>
    <text x="36" y="20.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5">SYSTEM ONE EDGE CORE • ACTIVE</text>
  </g>

  <!-- Main Hero Branding Content -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Main Title -->
    <text y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="50" font-weight="900" letter-spacing="2" filter="drop-shadow(0 4px 18px rgba(99, 102, 241, 0.45))">
      POLYGLOT EDGE AGENT
    </text>

    <!-- Subtitle / Mission Statement -->
    <text y="42" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.8">
      Ultra-Low Latency Intelligent Gateway • Edge Guardrails • Smart Model Router • Context Pruning
    </text>
  </g>

  <!-- Glowing Accent Divider Line -->
  <path d="M 280 236 L 920 236" stroke="url(#accentLine)" stroke-width="2" fill="none"/>

  <!-- 4 Core Capability Micro-Pills -->
  <g transform="translate(180, 268)">
    <!-- Pill 1: Edge Guardrails -->
    <g transform="translate(0, 0)">
      <rect width="195" height="58" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
      <rect width="195" height="58" rx="10" fill="#0284c7" fill-opacity="0.08"/>
      <path d="M 20 22 L 28 17 L 36 22 L 36 31 C 36 36 28 40 28 40 C 28 40 20 36 20 31 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
      <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Edge Guardrails</text>
      <text x="48" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Strands 2B &lt;15ms Filter</text>
    </g>

    <!-- Pill 2: Model Routing -->
    <g transform="translate(215, 0)">
      <rect width="195" height="58" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
      <rect width="195" height="58" rx="10" fill="#8b5cf6" fill-opacity="0.08"/>
      <path d="M 22 38 L 22 28 C 22 24 25 21 29 21 L 38 21 M 33 16 L 38 21 L 33 26 M 22 28 L 38 38" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Model Routing</text>
      <text x="48" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Small vs Frontier Tier</text>
    </g>

    <!-- Pill 3: Context Budgeting -->
    <g transform="translate(430, 0)">
      <rect width="195" height="58" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
      <rect width="195" height="58" rx="10" fill="#10b981" fill-opacity="0.08"/>
      <path d="M 22 20 H 36 V 38 H 22 Z M 26 26 H 32 M 26 31 H 30" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Smart Context</text>
      <text x="48" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Token Pruning &amp; Budget</text>
    </g>

    <!-- Pill 4: Dual Provider -->
    <g transform="translate(645, 0)">
      <rect width="195" height="58" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2"/>
      <rect width="195" height="58" rx="10" fill="#f59e0b" fill-opacity="0.08"/>
      <circle cx="28" cy="29" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <path d="M 28 20 A 9 9 0 0 1 37 29" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
      <text x="48" y="27" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Gemini &amp; Bedrock</text>
      <text x="48" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Supabase Auth &amp; Telemetry</text>
    </g>
  </g>

  <!-- Bottom Footer Line -->
  <g transform="translate(600, 368)" text-anchor="middle">
    <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" letter-spacing="0.5">
      Chrome Extension MV3 • FastAPI Async Core • Docker Containerized • Supabase Telemetry
    </text>
  </g>
</svg>

